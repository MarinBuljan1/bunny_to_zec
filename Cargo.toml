[package]
name = "bunny_to_zec"
version = "0.1.0"
edition = "2021"
description = "Bunny to Zec: an offline-capable Croatian vocabulary flashcard app"

[dependencies]
gloo-events = "0.2"
gloo-timers = "0.2"
gloo-net = "0.2"
indexmap = { version = "2", features = ["serde"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Element", "EventTarget", "PointerEvent", "HtmlElement", "HtmlDialogElement", "Document"] }
yew = { version = "0.20", features = ["csr"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# Reference tokenizer used by compatibility tests; excluded from browser builds.
regex = "1"
